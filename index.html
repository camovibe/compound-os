function migrate(s){var d=defaultState();if(!s||typeof s!=='object'||!Array.isArray(s.habits))return d;

/* ================= 复利引擎 ================= */
function isDone(hid,d){return !!(S.logs[d]&&S.logs[d][hid]);}
function setLog(h,d,val){if(!S.logs[d])S.logs[d]={};if(val){S.logs[d][h.id]=1;if(diffDays(d,h.created)>0)h.created=d;}else{delete S.logs[d][h.id];if(!Object.keys(S.logs[d]).length)delete S.logs[d];}}
function autoMark(key,d){var h=S.habits.find(function(x){return x.enabled&&x.key===key;});if(h)setLog(h,d,true);return h;}
function series(h,to){var out=[],T=today();if(diffDays(h.created,to)<0)return out;var cur=monday(h.created),wk=0;
while(diffDays(cur,to)>=0){var i=dow(cur);if(i===0)wk=0;var done=isDone(h.id,cur),st=null;
if(diffDays(h.created,cur)>=0){if(done)st='done';else if(cur===T)st='pending';else{var need=h.freq-wk;st=need>(6-i)?'miss':'rest';}out.push({d:cur,s:st});}
if(done)wk++;cur=addDays(cur,1);}return out;}
function rate(h,days){var T=today(),td=isDone(h.id,T),age=diffDays(h.created,T)+(td?1:0),n=Math.min(days,age);if(n<=0)return null;var c=0;
for(var i=0;i<n;i++){if(isDone(h.id,addDays(T,-(i+(td?0:1)))))c++;}return Math.min(1,c/(h.freq*n/7));}
function rankOf(xp){var i=0;for(var k=0;k<RANKS.length;k++)if(xp>=RANKS[k][0])i=k;var cur=RANKS[i],nx=RANKS[i+1];return{i:i,cur:cur,nx:nx,pct:nx?(xp-cur[0])/(nx[0]-cur[0]):1};}
function compute(){if(CACHE)return CACHE;var T=today(),g=(+S.settings.gain||0)/100,l=(+S.settings.loss||0)/100;
var hs=S.habits.filter(function(h){return h.enabled;}),per={},dayMap={};
hs.forEach(function(h){var ser=series(h,T),idx=100,cur=0,longest=0,breaks=0,comebacks=0,inMiss=false,dn=0,mn=0,st={},curve=[];
ser.forEach(function(x){st[x.d]=x.s;var m=dayMap[x.d]||(dayMap[x.d]={done:0,miss:0,rest:0,pending:0,n:0});m.n++;m[x.s]++;
if(x.s==='done'){idx*=1+g;dn++;cur++;if(inMiss){comebacks++;inMiss=false;}}
else if(x.s==='miss'){idx*=1-l;mn++;if(!inMiss){breaks++;inMiss=true;}cur=0;}
else if(x.s==='rest'){if(!inMiss)cur++;}
if(cur>longest)longest=cur;curve.push(idx);});
per[h.id]={h:h,ser:ser,st:st,idx:idx,streak:cur,longest:longest,breaks:breaks,comebacks:comebacks,doneN:dn,missN:mn,curve:curve};});
var start=T;hs.forEach(function(h){if(diffDays(h.created,start)>0)start=h.created;});
var oi=100,overall=[],d=start;
while(diffDays(d,T)>=0){var m=dayMap[d],delta=0;if(m&&m.n)delta=(m.done*g-m.miss*l)/m.n;oi*=1+delta;overall.push({d:d,v:oi,r:m&&m.n?m.done/m.n:0});d=addDays(d,1);}
var rs=hs.map(function(h){return rate(h,28);}).filter(function(x){return x!=null;});
var totalDone=0;Object.keys(S.logs).forEach(function(k){totalDone+=Object.keys(S.logs[k]).length;});
var pr=S.lifts.filter(function(x){return x.result==='pr';}).length,fail=S.lifts.filter(function(x){return x.result==='fail';}).length;
var comebacks=0,maxLongest=0;Object.keys(per).forEach(function(k){comebacks+=per[k].comebacks;maxLongest=Math.max(maxLongest,per[k].longest);});
var disc=S.trades.filter(function(t){return t.rules;}).length;
var xp=totalDone*10+S.workouts.length*15+pr*50+fail*25+S.body.length*5+S.journal.length*10+S.trades.length*5+disc*5+comebacks*30;
var todayDone=hs.filter(function(h){return isDone(h.id,T);}).length;
CACHE={per:per,dayMap:dayMap,overall:overall,idx:oi,p28:rs.length?rs.reduce(function(a,b){return a+b;},0)/rs.length:null,
totalDone:totalDone,pr:pr,fail:fail,comebacks:comebacks,maxLongest:maxLongest,workouts:S.workouts.length,journal:S.journal.length,discTrades:disc,
xp:xp,rank:rankOf(xp),todayDone:todayDone,todayTotal:hs.length,days:diffDays(S.created,T)+1,hs:hs};
return CACHE;}

function tstats(ts){var n=ts.length,wins=ts.filter(function(t){return t.pnl>0;}),loss=ts.filter(function(t){return t.pnl<0;});
var tot=ts.reduce(function(a,t){return a+t.pnl;},0),gw=wins.reduce(function(a,t){return a+t.pnl;},0),gl=-loss.reduce(function(a,t){return a+t.pnl;},0);
var rs=ts.filter(function(t){return t.r!=null&&isFinite(t.r);});var eq=0,peak=0,mdd=0,cl=0,mcl=0,curve=[];
ts.forEach(function(t){eq+=t.pnl;curve.push(eq);if(eq>peak)peak=eq;if(peak-eq>mdd)mdd=peak-eq;if(t.pnl<0){cl++;if(cl>mcl)mcl=cl;}else if(t.pnl>0)cl=0;});
return{n:n,win:n?wins.length/n:0,tot:tot,pf:gl?gw/gl:(gw?Infinity:0),avgW:wins.length?gw/wins.length:0,avgL:loss.length?gl/loss.length:0,
avgR:rs.length?rs.reduce(function(a,t){return a+t.r;},0)/rs.length:null,disc:n?ts.filter(function(t){return t.rules;}).length/n:0,mdd:mdd,mcl:mcl,curCL:cl,curve:curve};}

function chart(o){var W=340,H=o.h||150,P={l:36,r:8,t:10,b:18},iw=W-P.l-P.r,ih=H-P.t-P.b,tf=o.log?function(v){return v>0?Math.log(v):null;}:function(v){return v;};

var all=[];lines.forEach(function(L){L.tv.forEach(function(x){if(x!=null&&isFinite(x))all.push(x);});});
var mn=all.length?Math.min.apply(null,all):0,mx=all.length?Math.max.apply(null,all):1;if(mn===mx){mn-=1;mx+=1;}var pd=(mx-mn)*.08;mn-=pd;mx+=pd;
var n=Math.max.apply(null,lines.map(function(L){return L.v.length;}).concat([o.bars?o.bars.v.length:0,1]));
function X(i){return P.l+(n<=1?iw/2:i*iw/(n-1));}function Y(v){return P.t+ih-(v-mn)/(mx-mn)*ih;}
var fm=o.log?function(v){return fmtN(Math.exp(v));}:(o.fmt||fmtN);
var s='<svg viewBox="0 0 '+W+' '+H+'" class="chart">';
for(var k=0;k<=3;k++){var v=mn+(mx-mn)*k/3,y=Y(v);s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(P.l-4)+'" y="'+(y+3).toFixed(1)+'" class="ax" text-anchor="end">'+fm(v)+'</text>';}
if(o.bars){var bm=Math.max.apply(null,o.bars.v.concat([1])),bw=Math.max(3,iw/n*.55);o.bars.v.forEach(function(b,i){if(!b)return;var bh=b/bm*ih*.85;
s+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+(P.t+ih-bh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+o.bars.c+'" opacity=".35"/><text x="'+X(i).toFixed(1)+'" y="'+(P.t+ih-bh-2).toFixed(1)+'" class="ax" text-anchor="middle">'+b+'</text>';});}
lines.forEach(function(L){var d='',f=null,la=null;L.tv.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);if(f==null)f=i;la=i;});if(!d)return;
if(L.fill)s+='<path d="'+d+'L'+X(la).toFixed(1)+','+(P.t+ih)+'L'+X(f).toFixed(1)+','+(P.t+ih)+'Z" fill="'+L.c+'" opacity=".12"/>';
s+='<path d="'+d+'" fill="none" stroke="'+L.c+'" stroke-width="'+(L.w||1.8)+'"'+(L.dash?' stroke-dasharray="4 3"':'')+' stroke-linejoin="round"/>';
if(L.dot)s+='<circle cx="'+X(la).toFixed(1)+'" cy="'+Y(L.tv[la]).toFixed(1)+'" r="3.2" fill="'+L.c+'"/>';
if(L.pts)L.tv.forEach(function(v,i){if(v!=null)s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.2" fill="'+L.c+'"/>';});});
if(o.labels)s+='<text x="'+P.l+'" y="'+(H-4)+'" class="ax">'+esc(o.labels[0])+'</text><text x="'+(W-P.r)+'" y="'+(H-4)+'" class="ax" text-anchor="end">'+esc(o.labels[1])+'</text>';

var p={message:'backup '+today(),content:ghB64(body),branch:'main'};if(meta&&meta.sha)p.sha=meta.sha;
return ghFetch('/contents/state.json',{method:'PUT',body:JSON.stringify(p)}).then(function(r){
if(r.status===422)return ghFetch('/contents/state.json').then(function(r2){return r2.json();}).then(function(m2){p.sha=m2.sha;return ghFetch('/contents/state.json',{method:'PUT',body:JSON.stringify(p)});});
return r;});}).then(function(r){if(!r||!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(){
S.settings.ghLast=Date.now();save();toast(auto?'☁ 自动备份完成':'☁ 已备份到 GitHub：'+S.settings.ghRepo);if(!auto)render();})
.catch(function(e){if(!auto)toast('备份失败：'+e.message,'err');});}
function ghRestore(){if(!S.settings.ghPat){toast('先配置备份 Token','err');return;}
ghFetch('/contents/state.json').then(function(r){if(r.status===404)throw new Error('远端没有备份文件');return r.json();}).then(function(j){
var ns=migrate(JSON.parse(ghUnB64(j.content)));if(!ns||!Array.isArray(ns.habits))throw new Error('备份格式无效');
S=ns;save();closeSheet();VDATE=today();toast('已从 GitHub 恢复备份');render();})
.catch(function(e){toast('恢复失败：'+e.message,'err');});}

/* ================= BRIDGE ================= */
function importTrades(arr,source){if(!Array.isArray(arr))throw new Error('trades 必须是数组');var add=0,upd=0;source=source||'import';
arr.forEach(function(r){if(!r||!validDate(String(r.date||'').slice(0,10)))return;var extId=r.id!=null&&r.id!==''?source+':'+r.id:null;
var t={id:uid(),extId:extId,date:String(r.date).slice(0,10),symbol:String(r.symbol||'-').toUpperCase().slice(0,24),side:r.side==='short'?'short':'long',pnl:+r.pnl||0,r:r.r==null||r.r===''||!isFinite(+r.r)?null:+r.r,rules:r.rules!==false&&r.rules!=='false'&&r.rules!==0,emotion:String(r.emotion||'').slice(0,12),note:String(r.note||'').slice(0,200),source:source};
var ex=extId&&S.trades.find(function(x){return x.extId===extId;});if(ex){t.id=ex.id;Object.assign(ex,t);upd++;}else{S.trades.push(t);add++;}});
S.trades.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});save();return{add:add,upd:upd};}
function acceptPayload(p){if(!p)return;if(Array.isArray(p)){p.forEach(acceptPayload);return;}if(p.type&&p.type!=='COMPOUND_OS_IMPORT')return;if(!Array.isArray(p.trades))return;
try{var r=importTrades(p.trades,p.source||'bridge');toast('⇄ 接收交易：新增'+r.add+' 更新'+r.upd);render();}catch(e){toast('导入失败：'+e.message);}}
function processInbox(){var raw=Store.get(BRIDGE_KEY);if(!raw)return false;Store.del(BRIDGE_KEY);try{acceptPayload(JSON.parse(raw));}catch(e){}return true;}
function processHash(){var m=location.hash.match(/^#import=(.+)$/);if(!m)return;try{var js=decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));acceptPayload(JSON.parse(js));}catch(e){toast('URL 导入解析失败');}
try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}}
window.addEventListener('message',function(e){var ok=e.origin===location.origin||S.settings.origins.indexOf(e.origin)>=0;if(!ok)return;if(e.data&&e.data.type==='COMPOUND_OS_IMPORT')acceptPayload(e.data);});
try{var bc=new BroadcastChannel(BC_NAME);bc.onmessage=function(e){if(!processInbox()&&e.data&&e.data.type==='COMPOUND_OS_IMPORT')acceptPayload(e.data);};}catch(e){}
var API={version:APP_VERSION,schema:SCHEMA,
importTrades:function(arr,src){var r=importTrades(arr,src);render();return r;},
getState:function(){return JSON.parse(JSON.stringify(S));},
compute:function(){return compute();},
registerModule:function(m){if(m&&typeof m.render==='function'){EXT.push(m);render();}},
ext:function(ns,val){if(val===undefined)return S.ext[ns];S.ext[ns]=val;save();}};
window.CompoundOS=API;

/* ================= ICON ================= */
function drawIcon(size){var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d'),s=size/512;x.fillStyle='#04070a';x.fillRect(0,0,size,size);
x.strokeStyle='rgba(57,255,136,.12)';x.lineWidth=2*s;for(var i=0;i<=512;i+=32){x.beginPath();x.moveTo(i*s,0);x.lineTo(i*s,size);x.stroke();x.beginPath();x.moveTo(0,i*s);x.lineTo(size,i*s);x.stroke();}
x.strokeStyle='#39ff88';x.lineWidth=14*s;x.beginPath();x.moveTo(60*s,140*s);x.lineTo(60*s,60*s);x.lineTo(140*s,60*s);x.moveTo(452*s,372*s);x.lineTo(452*s,452*s);x.lineTo(372*s,452*s);x.stroke();
x.shadowColor='#39ff88';x.shadowBlur=24*s;x.lineWidth=20*s;x.lineCap='round';x.beginPath();for(var k=0;k<=100;k++){var px=(100+k*3.1)*s,py=(400-(Math.pow(1.045,k)-1)*3.45)*s;k?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
x.shadowBlur=0;x.fillStyle='#22e4ff';x.font='bold '+(64*s)+'px monospace';x.fillText('1.01',100*s,200*s);return c.toDataURL('image/png');}
function dl(name,href){var a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},100);}

/* ================= TOAST / RENDER ================= */
function toast(m){var t=$('#toast'),d=document.createElement('div');d.textContent=m;t.appendChild(d);setTimeout(function(){d.remove();},2200);}
function render(){var C=compute(),R=C.rank;$('#callsign').textContent=S.profile.name+' · '+today()+' · D+'+C.days;
$('#rankbox').innerHTML='<b>'+R.cur[1]+'</b> <span class="dim">'+R.cur[2]+'</span><div class="dim">'+C.xp+' XP'+(R.nx?' / '+R.nx[0]:'')+'</div><div class="xpbar"><i style="width:'+(R.pct*100).toFixed(1)+'%"></i></div>';
if(R.i>(S.ext.rankI||0)){S.ext.rankI=R.i;Store.set(KEY,JSON.stringify(S));setTimeout(function(){toast('★ 晋升：'+R.cur[1]+' '+R.cur[2]);vib([30,40,30]);},300);}
document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===TAB);});
var V={hq:vHQ,ops:vOPS,body:vBODY,trade:vTRADE,intel:vINTEL}[TAB]||vHQ;
try{$('#view').innerHTML=V();}catch(e){console.error(e);$('#view').innerHTML='<div class="panel"><div class="ph"><h3>SYSTEM FAULT</h3></div><pre class="code">'+esc(e&&e.stack||e)+'</pre></div>';}}

/* ================= EVENTS ================= */
function val(id){var el=$('#'+id);return el?el.value:'';}
document.addEventListener('click',function(e){
var tb=e.target.closest('[data-tab]');if(tb){TAB=tb.dataset.tab;window.scrollTo(0,0);render();return;}
var tg=e.target.closest('[data-tab-go]');if(tg){TAB=tg.dataset.tabGo;window.scrollTo(0,0);render();return;}
var t=e.target.closest('[data-act]');if(!t)return;var act=t.dataset.act;
if(t.dataset.confirm&&t.dataset.armed!=='1'){t.dataset.armed='1';var o=t.innerHTML;t.innerHTML='⚠ 再点确认';setTimeout(function(){if(t.isConnected){t.dataset.armed='';t.innerHTML=o;}},2500);return;}
var h,d;
switch(act){
case 'close':closeSheet();break;
case 'settings':fSettings();break;
case 'toggle':h=S.habits.find(function(x){return x.id===t.dataset.id;});if(!h)break;var nv=!isDone(h.id,VDATE);setLog(h,VDATE,nv);save();vib(nv?15:6);
if(nv){var P=compute().per[h.id];toast('✓ '+h.name+' +'+S.settings.gain+'% · 链条'+P.streak+'天');}else toast('撤销 '+h.name);render();break;
case 'day-prev':VDATE=addDays(VDATE,-1);render();break;
case 'day-next':if(VDATE<today())VDATE=addDays(VDATE,1);render();break;
case 'day-today':VDATE=today();render();break;
case 'library':fLibrary();break;
case 'lib-add':var lx=LIB.find(function(x){return x.key===t.dataset.key;});if(lx&&!S.habits.some(function(x){return x.key===lx.key;})){S.habits.push(mkHabit(lx));save();toast('已部署：'+lx.name);render();fLibrary();}break;
case 'add-habit':fHabit();break;
case 'save-habit':var nm=val('hName').trim();if(!nm){toast('请输入名称');break;}S.habits.push(mkHabit({name:nm.slice(0,20),icon:(val('hIcon')||'⭐').slice(0,4),freq:+val('hFreq')||7,cat:val('hCat')}));save();closeSheet();toast('已部署：'+nm);render();break;
case 'manage':fManage();break;
case 'h-del':var id=t.dataset.id;S.habits=S.habits.filter(function(x){return x.id!==id;});Object.keys(S.logs).forEach(function(k){delete S.logs[k][id];if(!Object.keys(S.logs[k]).length)delete S.logs[k];});save();render();fManage();break;
case 'add-workout':fWorkout();break;
case 'save-workout':d=clampDate(val('wDate'));S.workouts.push({id:uid(),date:d,type:val('wType'),dur:+val('wDur')||0,rpe:Math.min(10,Math.max(0,+val('wRpe')||0)),note:val('wNote').trim().slice(0,100)});
var fh=autoMark('fitness',d);save();closeSheet();toast('⚔ 训练入库 +15XP'+(fh?' · 已打卡健身':''));render();break;
case 'add-lift':fLift();break;
case 'save-lift':var ex=val('lEx').trim(),w=parseFloat(val('lW'));if(!ex||!(w>0)){toast('请填写动作与重量');break;}var res=val('lRes');
S.lifts.push({id:uid(),date:clampDate(val('lDate')),ex:ex.slice(0,20),w:w,reps:+val('lR')||1,result:res});save();closeSheet();toast(res==='pr'?'🏆 突破！+50XP':res==='fail'?'💥 失败已记录 +25XP · 这是弹药':'已记录');render();break;
case 'add-body':fBody();break;
case 'save-body':var bw=parseFloat(val('bW')),bf=parseFloat(val('bBf')),wa=parseFloat(val('bWa'));if(!(bw>0)&&!(bf>0)&&!(wa>0)){toast('至少填写一项');break;}
S.body.push({id:uid(),date:clampDate(val('bDate')),w:bw>0?bw:null,bf:bf>0?bf:null,waist:wa>0?wa:null});save();closeSheet();toast('⚖ 身体数据入库');render();break;
case 'add-trade':fTrade();break;
case 'save-trade':var pn=parseFloat(val('tPnl'));if(!isFinite(pn)){toast('请填写盈亏');break;}var rr=parseFloat(val('tR'));
S.trades.push({id:uid(),extId:null,date:clampDate(val('tDate')),symbol:(val('tSym')||'-').toUpperCase().slice(0,24),side:val('tSide'),pnl:pn,r:isFinite(rr)?rr:null,rules:val('tRules')==='1',emotion:val('tEmo'),note:val('tNote').trim().slice(0,200),source:'manual'});
S.trades.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});save();closeSheet();toast('◭ 交易入库');render();break;
case 'import-trades':fImport();break;
case 'do-import-trades':try{var pj=JSON.parse(val('impTxt'));var arr=Array.isArray(pj)?pj:pj.trades;var r=importTrades(arr,val('impSrc')||'import');closeSheet();toast('导入完成：新增'+r.add+' 更新'+r.upd);render();}catch(err){toast('JSON 解析失败：'+err.message);}break;
case 'api-doc':fApi();break;
case 'del':var col=t.dataset.col;if(S[col]){S[col]=S[col].filter(function(x){return x.id!==t.dataset.id;});save();render();}break;
case 'mood':MOOD=+t.dataset.v;document.querySelectorAll('[data-act="mood"]').forEach(function(b){b.classList.toggle('on',+b.dataset.v===MOOD);});break;
case 'save-journal':var tx=val('jTxt').trim();if(!tx){toast('写点什么吧');break;}var T=today(),ex2=S.journal.find(function(j){return j.date===T;});
if(ex2){ex2.text=tx;ex2.mood=MOOD;}else S.journal.push({id:uid(),date:T,text:tx,mood:MOOD});var marks=[];
if(tx.length>=10&&autoMark('review',T))marks.push('复盘');if(tx.length>=100&&autoMark('write',T))marks.push('写作');save();toast('📡 已存档'+(marks.length?' · 自动打卡'+marks.join('/'):''));render();break;
case 'save-settings':S.profile.name=(val('sName')||'指挥官').slice(0,16);S.profile.height=parseFloat(val('sH'))||'';S.profile.goalWeight=parseFloat(val('sGW'))||'';
S.settings.gain=Math.max(0,Math.min(10,parseFloat(val('sG'))||0));S.settings.loss=Math.max(0,Math.min(10,parseFloat(val('sL'))||0));
S.settings.origins=val('sO').split(',').map(function(s){return s.trim();}).filter(Boolean);
S.settings.ghPat=val('sGhPat').trim();S.settings.ghRepo=(val('sGhRepo').trim()||'compound-os-backup').replace(/[^a-zA-Z0-9\-_.]/g,'');save();closeSheet();toast('设置已保存');render();break;
case 'memento':fMemento();break;
case 'save-memento':S.memento.birth=val('mBirth');S.memento.years=+val('mYears')||80;S.memento.enough=val('mEnough').trim();save();closeSheet();toast('MEMENTO 已保存');render();break;
case 'fear-add':var ft=val('fearTxt').trim();if(!ft){toast('先写下来');break;}S.memento.fears.push({id:uid(),text:ft.slice(0,60),added:today(),done:false});save();render();break;
case 'fear-toggle':var ff=S.memento.fears.find(function(x){return x.id===t.dataset.id;});if(ff){ff.done=!ff.done;save();if(ff.done){toast('⚔ 直面恐惧：'+ff.text);vib([20,30,20]);}render();}break;
case 'fear-del':S.memento.fears=S.memento.fears.filter(function(x){return x.id!==t.dataset.id;});save();render();break;
case 'gh-backup':ghBackup(false);break;
case 'gh-restore':ghRestore();break;
case 'export':fExport();break;
case 'dl-backup':try{var bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var u=URL.createObjectURL(bl);dl('compoundos-backup-'+today()+'.json',u);setTimeout(function(){URL.revokeObjectURL(u);},2000);}catch(err){toast('下载受限，请使用复制');}break;
case 'copy-backup':var ta=$('#bkOut');try{navigator.clipboard.writeText(ta.value).then(function(){toast('已复制');},function(){ta.select();document.execCommand('copy');toast('已复制');});}catch(err){ta.select();try{document.execCommand('copy');toast('已复制');}catch(e2){toast('请手动长按复制');}}break;
case 'import-backup':fImportBackup();break;
case 'do-import-backup':try{var ns=JSON.parse(val('bkTxt'));if(!ns||!Array.isArray(ns.habits))throw new Error('不是有效备份');S=migrate(ns);save();closeSheet();VDATE=today();toast('备份已恢复');render();}catch(err){toast('导入失败：'+err.message);}break;
case 'reset':S=defaultState();save();closeSheet();VDATE=today();toast('系统已重置');render();break;
case 'install':if(window.__dip){window.__dip.prompt();window.__dip.userChoice.finally(function(){window.__dip=null;});}else toast('iOS：Safari分享→添加到主屏幕；Android：浏览器菜单→安装');break;
case 'gen-icons':try{dl('icon-192.png',drawIcon(192));setTimeout(function(){dl('icon-512.png',drawIcon(512));},400);toast('已生成，上传到仓库根目录');}catch(err){toast('生成失败');}break;
}});
document.addEventListener('change',function(e){var t=e.target;
if(t.id==='impFile'||t.id==='bkFile'){var f=t.files&&t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var ta=$(t.id==='impFile'?'#impTxt':'#bkTxt');if(ta)ta.value=rd.result;};rd.readAsText(f);return;}
var c=t.dataset.chg;if(!c)return;var h=S.habits.find(function(x){return x.id===t.dataset.id;});if(!h)return;
if(c==='h-en')h.enabled=t.checked;if(c==='h-freq')h.freq=+t.value;save();render();});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__dip=e;});
document.addEventListener('visibilitychange',function(){if(!document.hidden){processInbox();invalidate();if(VDATE>today())VDATE=today();render();try{if(S.settings.ghPat&&Date.now()-(+S.settings.ghLast||0)>432e5)ghBackup(true);}catch(e){}}});

/* ================= BOOT ================= */
try{$('#appleIcon').href=drawIcon(180);}catch(e){}
processHash();processInbox();render();
try{setTimeout(function(){if(S.settings.ghPat&&Date.now()-(+S.settings.ghLast||0)>432e5)ghBackup(true);},4000);}catch(e){}
if(!Store.ok)setTimeout(function(){toast('⚠ 存储受限：当前为内存模式，请及时导出备份');},1400);
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}}catch(e){}
})();
</script>
